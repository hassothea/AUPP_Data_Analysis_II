<script>
document.addEventListener("DOMContentLoaded", () => {
    // 1. Create the persistent header and footer
    let header = document.createElement('div');
    header.id = 'quarto-custom-header';
    header.innerHTML = `
        <div class="header-section"></div>
        <div class="header-subsection"></div>
    `;
    
    let footerLine = document.createElement('div');
    footerLine.id = 'quarto-custom-footer-line';
    
    // Append them to the slide canvas
    let revealContainer = document.querySelector('.reveal .slides');
    if (revealContainer) {
        revealContainer.appendChild(header);
        revealContainer.appendChild(footerLine);
    }

    // 2. Function to update text
    function updateHeader() {
        let slide = Reveal.getCurrentSlide();
        if (!slide) return;

        // Hide entirely on title slides
        if (slide.matches('#title-slide') || slide.classList.contains('title-slide')) {
            header.style.display = 'none';
            footerLine.style.display = 'none';
            return;
        }
        header.style.display = 'flex';
        footerLine.style.display = 'block';

        // Hide entirely on title slides OR slides with the .no-header class
        if (slide.matches('#title-slide') || 
            slide.classList.contains('title-slide') || 
            slide.classList.contains('no-header')) {
            
            header.style.display = 'none';
            footerLine.style.display = 'none';
            return;
        }

        // Find Section (h1)
        let parentStack = slide.closest('section.stack');
        let sectionTitle = "";
        if (parentStack) {
            let h1 = parentStack.querySelector('h1');
            if (h1) sectionTitle = h1.innerText;
        }

        // Find Subsection (h2) with MEMORY
        let h2 = slide.querySelector('h2');
        let subTitle = "";

        if (h2) {
            // If the current slide has a title, use it
            subTitle = h2.innerText;
        } else if (parentStack) {
            // If it DOESN'T have a title, look backwards to remember the last one
            let allSlides = Array.from(parentStack.querySelectorAll('section'));
            let currentIndex = allSlides.indexOf(slide);
            
            for (let i = currentIndex - 1; i >= 0; i--) {
                let prevH2 = allSlides[i].querySelector('h2');
                if (prevH2) {
                    subTitle = prevH2.innerText;
                    break;
                }
            }
        }

        // Keep the subsection blank if we are looking at the main # Section slide
        if (slide.querySelector('h1')) {
            subTitle = "";
        }

        // Inject the text into the header
        header.querySelector('.header-section').innerText = sectionTitle;
        header.querySelector('.header-subsection').innerText = subTitle;
    }

    // 3. Trigger updates safely
    if (Reveal.isReady()) {
        updateHeader();
    } else {
        Reveal.on('ready', updateHeader);
    }
    Reveal.on('slidechanged', updateHeader);
});
</script>
